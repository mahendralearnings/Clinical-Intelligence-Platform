[project]
name = "clinical-intelligence-platform"
version = "0.1.0"
description = "Enterprise Clinical Intelligence Platform (RAG + Agents) for pharma/healthcare"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "bcrypt>=4.1.0",
    "tenacity",
    "pyjwt>=2.9.0",
    "langchain-text-splitters>=1.1.2",
    "tiktoken>=0.13.0",
    "numpy>=2.5.1",
    "scikit-learn>=1.9.0",
    "boto3>=1.35.0",
    "anthropic>=0.122.0",
    "openai>=2.45.0",
    "langsmith>=0.10.15",
    "langgraph>=1.2.11",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "streamlit>=1.62.0",
    "requests>=2.34.2",
    "crewai",
    "mcp[cli]>=1.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
